<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tag Arena</title>
  </head>
  <body>
    <!-- The 3D canvas gets injected here by main.js -->
    <div id="app"></div>

    <!-- HUD: plain HTML floating over the game -->
    <div id="hud">
      <h1>TAG ARENA</h1>
      <div id="role" class="runner">🏃 RUN!</div>
      <div id="timer">0.0s</div>
      <div id="tags">Tags: 0</div>
      <div id="help">Click the game to look around &bull; WASD to move &bull; Space to jump &bull; Click a tree to swing &bull; SHIFT / C to climb the vine! (ESC frees your mouse)</div>
    </div>

    <!-- Flash message on every tag ("TAGGED! You're it!") -->
    <div id="flash" class="hidden"></div>

    <!-- Touch controls: joystick + buttons (visible in touch mode) -->
    <div id="touch-ui" class="hidden">
      <div id="joystick"><div id="stick"></div></div>
      <div id="btn-jump" class="touch-btn">JUMP</div>
      <div id="btn-up" class="touch-btn climb hidden">&#9650;</div>
      <div id="btn-down" class="touch-btn climb hidden">&#9660;</div>
    </div>

    <!-- Toggle between PC and touch controls (remembers your choice) -->
    <button id="controls-toggle" title="Switch controls">&#127918;</button>

    <!-- Customize your gorilla -->
    <button id="customize-btn" title="Customize your gorilla">🎨</button>

    <!-- Character customization panel -->
    <div id="customize-panel" class="hidden">
      <h2>🎨 Your Gorilla</h2>
      <div class="cust-row"><span>Fur</span><div id="fur-swatches" class="swatches"></div></div>
      <div class="cust-row"><span>Gear</span><div id="acc-buttons">
        <button data-acc="none" class="selected">None</button><button data-acc="cap">🧢 Cap</button><button data-acc="shades">🕶️ Shades</button><button data-acc="partyhat">🎉 Party hat</button>
      </div></div>
      <div class="cust-row"><span>Shorts</span><div id="shorts-swatches" class="swatches"></div></div>
      <button id="customize-close">Done</button>
    </div>

    <!-- Shown when the chaser catches you -->
    <div id="banner" class="hidden">
      <h2>CAUGHT!</h2>
      <p>You survived <span id="final-time">0</span> seconds</p>
      <p>Press R to run again</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
